<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Die Katze im Regen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap">

</head>
<body>
  <main>
    <header>
      <h1>Die Katze im Regen</h1>
      <p>Ein animierter Comic-Roman im Noir-Stil: eine Detektivin, eine gestohlene Kette, eine Jagd über die Dächer – und eine überraschende Täterin. Sechs Seiten, knapp 2 Minuten. · <a href="https://github.com/schwarzf/hello-claude/releases/download/videos/regenkatze.mp4">🎬 Als Video ansehen</a> · <a href="index.html">Zu den Dino-Tasks</a></p>
    </header>
    <div class="screen" id="screen">
      <canvas id="demo" width="640" height="400"></canvas>
      <div class="start" id="start">
        <p class="title">DIE KATZE IM REGEN</p>
        <button type="button" id="play">▶ Aufschlagen</button>
        <button type="button" id="play-silent" class="secondary">Ohne Ton</button>
        <p class="hint">Mit Jazz im Ohr am schönsten.</p>
      </div>
    </div>
    <div class="bar">
      <button type="button" id="btn-sound" aria-pressed="true">🔊 Ton</button>
      <button type="button" id="btn-full">⛶ Vollbild</button>
      <span id="part" aria-live="polite"></span>
    </div>
  </main>
  <script src="js/musik.js?v=202611131014"></script>
  <script src="js/toon/toon.js?v=202611131014"></script>
