<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskverwaltung – Tests</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    iframe { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Tests der Taskverwaltung</h1>
    <p class="subtitle">Unit-Tests für den TaskStore und UI-Tests gegen <a href="index.html">index.html</a>. Deine echten Tasks werden dabei nicht verändert.</p>

    <section class="card">
      <p class="test-summary" id="summary">Tests laufen …</p>
      <button type="button" id="rerun">Erneut ausführen</button>
    </section>

    <section class="card">
      <h2>Unit-Tests (TaskStore)</h2>
      <ul class="results" id="unit-results"></ul>
    </section>

    <section class="card">
      <h2>UI-Tests (index.html)</h2>
      <ul class="results" id="ui-results"></ul>
      <p class="stats">Testinstanz der Oberfläche:</p>
      <iframe id="app-frame" title="Taskverwaltung im Testmodus"></iframe>
    </section>
  </main>

  <script src="js/taskstore.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
