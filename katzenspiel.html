<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katzen-Jump'n'Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/katzenspiel.css?v=202610271915">
</head>
<body>
  <main>
    <header class="hero">
      <canvas id="mascot" width="180" height="120" aria-hidden="true"></canvas>
      <div class="text">
        <h1>Katzen-Jump'n'Run</h1>
        <p class="subtitle">Lauf, spring, duck dich, jag Mäuse – und erreiche den Futternapf! · <a href="index.html">Zu den Dino-Tasks</a></p>
      </div>
    </header>

    <section class="game" aria-label="Spiel">
      <div class="hud">
        <span class="level" id="hud-level">Level 1</span>
        <span class="lives" id="hud-lives" aria-label="Leben"></span>
        <span class="score">Punkte: <strong id="hud-score">0</strong></span>
        <button type="button" class="small" id="btn-pause" aria-label="Pause">⏸</button>
        <button type="button" class="small" id="btn-music" aria-label="Musik an/aus" aria-pressed="true">🎵</button>
        <button type="button" class="small" id="btn-sound" aria-label="Geräusche an/aus">🔊</button>
      </div>
      <div class="progress" aria-hidden="true"><div id="hud-progress"></div><span>🥣</span></div>

      <div class="stage">
        <canvas id="game" width="960" height="480"></canvas>
        <div class="touch" aria-label="Steuerung">
          <div class="touch-move" role="group" aria-label="Laufen">
            <button type="button" class="tbtn" id="btn-left" aria-label="Nach links laufen">◀</button>
            <button type="button" class="tbtn" id="btn-right" aria-label="Nach rechts laufen">▶</button>
          </div>
          <div class="touch-action" role="group" aria-label="Aktionen">
            <button type="button" class="tbtn small-btn" id="btn-pounce" aria-label="Satz nach vorn">🐾<small>Satz</small></button>
            <button type="button" class="tbtn small-btn" id="btn-duck" aria-label="Ducken">⬇<small>Ducken</small></button>
            <button type="button" class="tbtn big-btn" id="btn-jump" aria-label="Springen">⬆<small>Springen</small></button>
          </div>
        </div>
        <div class="overlay" id="overlay">
          <div class="panel">
            <h2 id="overlay-title">Katzen-Jump'n'Run</h2>
            <div id="overlay-text"></div>
            <button type="button" class="primary" id="overlay-button">Los geht's!</button>
          </div>
        </div>
      </div>

      <p class="keys">Tastatur: <kbd>←</kbd> <kbd>→</kbd> laufen (lange halten = schneller) · <kbd>Leertaste</kbd>/<kbd>↑</kbd> springen · <kbd>↓</kbd> ducken · <kbd>X</kbd> Satz · <kbd>P</kbd> Pause</p>
    </section>
  </main>

  <script src="js/spiel.js?v=202610271915"></script>
  <script src="js/musik.js?v=202610271915"></script>
  <script src="js/katzenspiel.js?v=202610271915"></script>
</body>
</html>
