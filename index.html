<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino-Taskverwaltung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="hero">
      <img src="img/trex.svg" alt="Comic T-Rex">
      <div class="text">
        <p class="bubble">RAWR! Was steht heute an?</p>
        <h1>Dino-Tasks</h1>
        <p class="subtitle">Tasks werden lokal im Browser gespeichert. · <a href="test.html">Tests ausführen</a></p>
      </div>
    </header>

    <a class="card promo" href="katzen.html">
      <img src="img/katze.svg" alt="">
      <span class="promo-text">
        <strong>NEU: Katzen-Morphing!</strong>
        <span>Lade zwei Katzenfotos hoch und mische sie zu einer neuen Katze.</span>
      </span>
      <span class="promo-arrow" aria-hidden="true">➜</span>
    </a>

    <a class="card promo promo-gesichter" href="gesichter.html">
      <img src="img/gesicht.svg" alt="">
      <span class="promo-text">
        <strong>NEU: Gesichter-Morphing!</strong>
        <span>Zwei Fotos von Menschen hochladen – die Gesichtspunkte werden automatisch erkannt.</span>
      </span>
      <span class="promo-arrow" aria-hidden="true">➜</span>
    </a>

    <section class="card">
      <form class="new-task" id="new-task-form">
        <input name="title" type="text" placeholder="Neuer Task für die Herde …" aria-label="Titel" autocomplete="off">
        <select name="priority" aria-label="Priorität">
          <option value="niedrig">Niedrig</option>
          <option value="mittel" selected>Mittel</option>
          <option value="hoch">Hoch</option>
        </select>
        <input name="dueDate" type="date" aria-label="Fällig am">
        <button type="submit" class="primary">Hinzufügen</button>
      </form>
      <p class="error" id="form-error" role="alert"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter">
          <button type="button" data-filter="alle" aria-pressed="true">Alle</button>
          <button type="button" data-filter="offen" aria-pressed="false">Offen</button>
          <button type="button" data-filter="erledigt" aria-pressed="false">Erledigt</button>
        </div>
        <input id="search" type="search" placeholder="Suchen …" aria-label="Suchen">
      </div>
    </section>

    <section class="card">
      <ul class="tasks" id="task-list"></ul>
      <div class="toolbar" style="margin-top: 12px;">
        <span class="stats" id="stats"></span>
        <button type="button" id="clear-completed">Erledigte löschen</button>
      </div>
    </section>
  </main>

  <script src="js/taskstore.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
