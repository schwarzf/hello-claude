<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katzen-Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/demo.css?v=202611052029">
</head>
<body>
  <main>
    <header>
      <h1>Katzen-Demo</h1>
      <p>Regenbogen-Flug, Wollknäuel-Jagd, tanzende Katzen, Longcats und die Katzenband „The Miaus“ – mit Synth-Sound, viel Bass und Miau. · <a href="video/katzendemo.mp4">🎬 Als Video ansehen</a> · <a href="index.html">Zu den Dino-Tasks</a></p>
    </header>

    <div class="screen" id="screen">
      <canvas id="demo" width="320" height="200"></canvas>
      <div class="crt" aria-hidden="true"></div>
      <div class="start" id="start">
        <p class="blink">HELLO-CLAUDE PRESENTS: MIAU!</p>
        <button type="button" id="play">▶ DEMO STARTEN</button>
        <button type="button" id="play-silent" class="secondary">OHNE TON</button>
        <p class="hint">Mit Kopfhörern oder guten Lautsprechern – es gibt viel Bass!</p>
      </div>
    </div>

    <div class="bar">
      <button type="button" id="btn-sound" aria-pressed="true">🔊 TON</button>
      <button type="button" id="btn-crt" aria-pressed="true">📺 RÖHRE</button>
      <button type="button" id="btn-full">⛶ VOLLBILD</button>
      <span id="part" aria-live="polite"></span>
    </div>
  </main>

  <script src="js/musik.js?v=202611052029"></script>
  <script src="js/katzendemo-musik.js?v=202611052029"></script>
  <script src="js/katzendemo.js?v=202611052029"></script>
</body>
</html>
